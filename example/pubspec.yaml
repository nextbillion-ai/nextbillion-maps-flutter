name: nb_maps_flutter_example
description: Demonstrates how to use the nb_maps_flutter plugin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.0
  collection: ^1.0.0
  device_info_plus: ^13.1.0
  nb_maps_flutter:
    path: ../
  path_provider: ^2.0.0


dev_dependencies:
  integration_test:
    sdk: flutter
  vm_service: ^15.0.2
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

  assets:
    - integration_test/fixtures/offline-import-android.db
    - integration_test/fixtures/offline-import-ios.db
    - integration_test/fixtures/offline-import-v5.db
    - assets/fill/cat_silhouette_pattern.png
    - assets/fill-extrusion/indoor_3d_map.json
    - assets/symbols/custom-icon.png
    - assets/symbols/location_off.png
    - assets/symbols/location_on.png
    - assets/symbols/2.0x/custom-icon.png
    - assets/symbols/3.0x/custom-icon.png
    - assets/style.json
