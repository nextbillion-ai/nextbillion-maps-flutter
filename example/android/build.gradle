plugins {
    id 'com.google.cloud.artifactregistry.gradle-plugin' version '2.2.1'
}

allprojects {
    apply plugin: 'com.google.cloud.artifactregistry.gradle-plugin'

    repositories {
        google()
        maven {
            // Uses GOOGLE_APPLICATION_CREDENTIALS or local Application Default Credentials.
            url = uri('artifactregistry://asia-maven.pkg.dev/nextbillion/mobile-snapshot-maven')
            content {
                includeVersion 'ai.nextbillion', 'nb-maps-android', '3.4.0-SNAPSHOT'
            }
            mavenContent {
                snapshotsOnly()
            }
        }
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('lintReport', GradleBuild) {
    description = 'Generates lint reports for all modules'
    group = 'verification'

}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
